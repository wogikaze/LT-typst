[env]
TEMPLATE_MAIN = "template/main.typ"
TEMPLATE_OUT = "build/template/main.pdf"
DISCORD_BOT_MAIN = "discord-bot/discord-bot.typ"
DISCORD_BOT_OUT = "build/discord-bot/discord-bot.pdf"

[tasks.build]
description = "Build a Typst deck by directory name"
usage = '''
arg "<target>" help="Deck directory name"
'''
run = '''
set -eu

TARGET="{{usage.target}}"
TARGET="${TARGET%/}"

SRC="$TARGET/$TARGET.typ"
OUT="build/$TARGET/$TARGET.pdf"

if [ ! -f "$SRC" ]; then
  echo "Source file not found: $SRC"
  exit 1
fi

mkdir -p "build/$TARGET"
typst compile --root . "$SRC" "$OUT"
'''

[tasks.check]
description = "Compile all decks that should stay healthy"
depends = ["build"]

[tasks.clean]
description = "Remove generated PDFs"
run = "rm -rf build"
